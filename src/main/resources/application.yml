spring:
  datasource:
    url: ${SLOTTING_ADMIN_DATABASE_URL}
    username: ${SLOTTING_ADMIN_DATABASE_USERNAME}
    password: ${SLOTTING_ADMIN_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${SLOTTING_DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${SLOTTING_DB_POOL_MAX_SIZE:20}
      connection-timeout: ${SLOTTING_DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${SLOTTING_DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${SLOTTING_DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${SLOTTING_DB_POOL_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,schemaMigration,identityReadiness,ledgerReadiness,providerReadiness,kmsReadiness,workerReadiness,policyReadiness
  endpoints:
    web:
      exposure:
        include: health
  health:
    db:
      enabled: true

slotting:
  schema:
    supported-version: 59
  security:
    device-cap: 5
    max-travel-speed-kmh: 900
    trusted-location-proxies: ${SLOTTING_TRUSTED_LOCATION_PROXIES:}
  fairness:
    reveal:
      require-finalized: true
  outbox:
    worker:
      enabled: true
      fixed-delay-ms: 1000
